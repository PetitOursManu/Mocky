# fail2ban filter for Mocky — /etc/fail2ban/filter.d/mocky.conf
#
# Matches the authentication lines Mocky writes to stdout. The format is fixed
# by `logAuth()` in server/index.js; if the wording changes there, this file has
# to change with it.
#
# Lines look like:
#   mocky auth failure user="alice" ip=203.0.113.7
#   mocky auth locked  user="alice" ip=203.0.113.7
#   mocky auth success user="alice" ip=203.0.113.7
#
# Only `failure` and `locked` are banned on. `success` is matched too, as an
# ignoreregex, so a working sign-in never contributes to a ban.

[Definition]

failregex = ^.*mocky auth failure user=".*" ip=<HOST>\s*$
            ^.*mocky auth locked user=".*" ip=<HOST>\s*$

ignoreregex = ^.*mocky auth success user=".*" ip=<HOST>\s*$

# Docker prefixes each line with a timestamp; journald adds its own. Neither is
# assumed — the patterns above anchor on the message, not on the prefix.
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S
              {^LN-BEG}
