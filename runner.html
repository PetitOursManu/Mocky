<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <!-- This page mounts model-written code in frames that can reach it (the
         legibility probe's capture frame is same-origin; see src/lib/capture.ts).
         The server's network rule (server/mcp/runner.js) already decides every
         request; this policy narrows what the page's own realm may even ask
         for: its API on its own origin, nothing else to connect to. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src * data: blob:; font-src * data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' about: blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Mocky runner</title>
    <style>
      html, body { margin: 0; padding: 0; background: #fff; }
    </style>
  </head>
  <body>
    <!-- Opened by the server's headless Chromium only (server/mcp/runner.js).
         Nothing here is useful to a person, and nothing works without the
         runner token the server injects. -->
    <div id="runner-root"></div>
    <script type="module" src="/src/runner/main.tsx"></script>
  </body>
</html>
