# Mocky + the Motion render worker, in one stack.
#
#   docker compose -f docker-compose.motion.yml up -d --build
#
# ── What this file is for ────────────────────────────────────────────────────
#
# `docker-compose.yml` keeps the render worker behind `profiles:
# ["video-export"]`, and that is a licensing decision rather than a technical
# one: Remotion is free for individuals, non-profits and companies with up to
# three employees, and its licence does not address redistribution inside a
# self-hosted product. Shipping it in the default path would hand the question
# to every operator who never uses the feature.
#
# A profile is a flag on a command line, and some deployments have no command
# line to put it on. A platform that deploys a compose file from a repository —
# Coolify, Dokploy, Portainer, a CI job — chooses a FILE, and often cannot pass
# `--profile`. This is that file: choosing it is the same deliberate act as
# typing the flag, and the answer to the licence question is the same one.
#
# ── Why it includes rather than copies ───────────────────────────────────────
#
# Everything about both services — the build contexts, the volumes, the internal
# network with no route out, the worker's memory limit, its /dev/shm, its health
# check — lives in `docker-compose.yml` and is read from there. A copy would be
# a second file to keep in step, and the first thing to drift would be a limit
# nobody notices until a render takes the host down. The only thing said here is
# that the worker's profile does not apply: `!reset` is Compose's own way of
# clearing an inherited list rather than adding to it.
#
# `docker-compose.override.yml` is NOT loaded by this file — Compose only loads
# an override automatically beside `docker-compose.yml`. That is the right
# behaviour here: the override in this repository is a development file that
# pins Mocky's origin to localhost.
#
# ── On a server ──────────────────────────────────────────────────────────────
#
# The worker asks for 4 GB of memory and 2 cores while it renders, so plan for
# them on top of Mocky itself. Nothing else changes: the worker publishes no
# port, has no route out of its own bridge, and Mocky reaches it in-cluster at
# http://video-worker:3030 — which is the address to leave in Admin → Motion.
#
# READ worker/video/README.md FIRST. It is a warning, not a footnote.
include:
  - docker-compose.yml

services:
  video-worker:
    profiles: !reset []
