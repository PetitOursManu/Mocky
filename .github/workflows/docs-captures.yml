# Remakes the documentation's annotated screenshots (scripts/capture-docs.mjs):
# both languages, at 2880 px, with the points on each picture measured from the
# page. Manual, because a picture changes only when the interface does — and
# the result is a patch to review, not a commit.
name: docs captures

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these captures, comma-separated (canvas,home,…). Empty: all of them.'
        required: false
        default: ''
  # TEMPORARY — refreshes the captures from this branch; removed right after.
  push:
    branches: [refonte/phase-1-theme]
    paths: ['.github/workflows/docs-captures.yml']

permissions:
  contents: read

jobs:
  capture:
    name: capture the screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The shell's typeface. Without it the runner's fallback sans is what the
      # documentation would show.
      - name: Install Inter
        run: sudo apt-get update && sudo apt-get install -y fonts-inter
      - run: npm ci
      - run: npm run build
      # Chromium is the runner's own Google Chrome, found by the same lookup the
      # MCP runner uses (server/mcp/runner.js).
      - name: Capture
        run: node scripts/capture-docs.mjs ${{ inputs.only != '' && format('--only={0}', inputs.only) || '' }}
      # The pictures and the rewritten hotspot coordinates, as one patch to
      # apply with `git apply --binary captures.patch`, and the pictures loose
      # to look at.
      - name: Collect
        if: always()
        run: git diff --binary -- docs > captures.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-captures
          path: |
            captures.patch
            docs/assets/ui/
