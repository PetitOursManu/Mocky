# Mocky — Docker Compose
# Usage:
#   docker compose up -d                    # start Mocky on http://localhost:8787
#   docker compose up -d --build            # rebuild after code changes
#   docker compose down                     # stop
#
# Data (accounts, sessions, projects) persists in the named volume mocky-data.
# SSO env vars are optional — uncomment and set them to enable "Sign in with Dashy".

services:
  mocky:
    build: .
    image: mocky:latest
    container_name: mocky
    ports:
      # Bound to the loopback interface by default: Mocky has routes that spend
      # your model credits, so it must not be reachable from the LAN unless you
      # say so. Put it behind a reverse proxy, or set MOCKY_BIND=0.0.0.0 in .env
      # to expose it directly (and read the "Reverse proxy / HTTPS" section of
      # the README first).
      - "${MOCKY_BIND:-127.0.0.1}:8787:8787"
    volumes:
      - mocky-data:/app/server/data
    # Values from a local .env file (copied from .env.example). Without this,
    # nothing in .env ever reaches the container.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 8787
    restart: unless-stopped
    # /api/health, not /api/config: the latter answers 200 from memory even when
    # the data directory is read-only or the frontend was never built.
    healthcheck:
      # MOCKY_PORT first, matching the server's own precedence (and the
      # Dockerfile's HEALTHCHECK). Reading PORT alone meant that setting
      # MOCKY_PORT in .env gave a container that worked perfectly and reported
      # itself `unhealthy` forever.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.MOCKY_PORT||process.env.PORT||8787)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  mocky-data: