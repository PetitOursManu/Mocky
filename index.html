<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      The .ico, not the .svg. favicon.svg is 665 kB — a base64 raster wrapped in
      SVG by a favicon generator — which is MORE than the whole application
      bundle (597 kB), fetched on every first load for a 16px square. The .ico
      is 15 kB and carries three real sizes (16, 32, 48), so it is sharper at the
      sizes a tab actually uses. The .svg stays in the repo: the READMEs use it
      as the project logo, where its size does not matter.
      No apple-touch-icon: Safari ignores SVG there, so the old line never
      worked. Add a 180x180 PNG if iOS home-screen icons ever matter.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Mocky — chat-to-UI generator</title>
    <script>
      // Theme before first paint. This used to run from main.tsx, i.e. after the
      // first frame was already on screen, while :root was hard-coded dark — so
      // opening Mocky in the light theme flashed dark on every single load.
      // Inline and synchronous in <head> is the only place this can go.
      (function () {
        try {
          var t = localStorage.getItem('mocky.theme')
          if (t === 'logo') t = 'light' // the old third theme
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = t
        } catch (_) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
